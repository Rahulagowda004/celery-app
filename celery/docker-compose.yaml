services:
  redis:
    image: redis:7-alpine
    ports:
      - "8231:6379"

  worker:
    build:
      context: ..
      dockerfile: celery/Dockerfile
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app/celery
    command: celery -A tasks worker --loglevel=info --autoscale=10,1

# Scale workers: docker compose up --scale worker=3
